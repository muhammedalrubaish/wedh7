<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#702928" />
    <meta name="description" content="نظام مبيعات ومخزون لمعمل ومحل «وضح» للحلويات — بوكسات، عملاء، مرتجعات، وكشوف حساب" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23702928'/%3E%3Cg transform='translate(3.2 3.2) scale(0.8)'%3E%3Crect x='5' y='12.5' width='22' height='13' rx='2.6' fill='none' stroke='%23d9af97' stroke-width='2.6'/%3E%3Ccircle cx='9.8' cy='11' r='3.1' fill='%23d9af97'/%3E%3Ccircle cx='16' cy='9.6' r='3.1' fill='%23d9af97'/%3E%3Ccircle cx='22.2' cy='11' r='3.1' fill='%23d9af97'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>وضح</title>

    <!-- المظهر قبل أول رسم: الإعدادات في IndexedDB ولا تُقرأ إلا بعد تحميل JS، فبدون
         هذا تومض الصفحة فاتحةً ثم تصير داكنة. `store/app.tsx` يكتب هذه النسخة. -->
    <script>
      try {
        if (localStorage.getItem('wedh7.theme') === 'dark')
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <link rel="preload" as="image" href="/brand-mark.png" />
    <!-- شاشة التحميل الأولى قبل JS: أطول انتظار على شبكة الجوال. أنماطها هنا لأن
         index.css لم يُحمَّل بعد، وألوانها نفس رموز الهوية. React يستبدلها كلها عند
         أول رسم. نفس الشكل في src/components/Splash.tsx. -->
    <style>
      html { background: #f6ece2; }
      html.dark { background: #1f1314; }
      .boot { min-height: 100dvh; display: grid; place-items: center; }
      .boot > div { display: flex; flex-direction: column; align-items: center; gap: 24px; }
      .boot-logo {
        width: 192px; aspect-ratio: 1540 / 634; background: #702928;
        -webkit-mask: url('/brand-mark.png') center / contain no-repeat;
        mask: url('/brand-mark.png') center / contain no-repeat;
      }
      .boot-spin {
        width: 32px; height: 32px; border-radius: 50%; border: 3px solid #e6d6c7;
        border-top-color: #702928; animation: boot-spin 0.9s linear infinite;
      }
      html.dark .boot-logo { background: #d9af97; }
      html.dark .boot-spin { border-color: #3d2a2b; border-top-color: #d9af97; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>

    <!-- «إضافة إلى الشاشة الرئيسية»: النظام يُفتح من أيقونة لا من عنوان مكتوب،
         وهذا ما يحتاجه من يقف خلف الكاونتر. `standalone` يُخفي شريط العنوان
         فتكسب الشاشة مساحته، والأيقونات تُولَّد من نفس هندسة أيقونة الصفحة
         أعلاه عبر `node scripts/make-icons.mjs` — مصدر واحد لا اثنان. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="وضح" />
    <meta name="application-name" content="وضح" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` لا `black-translucent`: الأخير يمدّ الصفحة تحت شريط الحالة،
         والواجهة لا تحجز `safe-area-inset` بعد، فيختفي أعلى الشاشة خلف النتوء. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- خلفية الغرفة الشبكية: مكتوبة في الصفحة نفسها لا داخل React كي تظهر مع
         أول رسم قبل تحميل حزمة JS، وتبقى خارج شجرة إعادة الرسم فلا تكلّف
         التطبيق شيئاً عند كل تحديث حالة. `aria-hidden` لأنها زخرفة بحتة. -->
    <div class="room" aria-hidden="true">
      <div class="room-plane room-floor"><i></i><i></i><i></i></div>
      <div class="room-plane room-ceiling"><i></i><i></i></div>
      <div class="room-plane room-left"><i></i><i></i></div>
      <div class="room-plane room-right"><i></i><i></i></div>
    </div>
    <div class="brand-watermark" aria-hidden="true"></div>
    <div id="root">
      <div class="boot" role="status" aria-label="جارٍ التحميل">
        <div><div class="boot-logo"></div><div class="boot-spin"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
